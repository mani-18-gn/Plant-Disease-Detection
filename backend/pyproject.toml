[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plantguard-backend"
version = "0.1.0"
description = "FastAPI backend for PlantGuard multi-agent system"
authors = [{ name = "PlantGuard Team" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "psycopg2-binary",
    "pyjwt",
    "passlib",
    "python-dotenv",
    "httpx"
]
